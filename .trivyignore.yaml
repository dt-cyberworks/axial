# Documented, compensated exceptions for the supply-chain scan (REQ-SUPPLY-002).
# Every entry is a deliberate design decision with a compensating control, not a
# defect to fix. Keep this list minimal and justified.
misconfigurations:
  - id: DS-0002
    paths:
      - "raw-egress-gateway/Dockerfile"
      - "edge/Dockerfile"
      - "frontend/Dockerfile"
    statement: >-
      Intentional root, compensated. raw-egress-gateway runs as root only to
      install and maintain the nftables deny-all OUTPUT policy; it owns just
      CAP_NET_ADMIN (cap_drop ALL) with a read_only rootfs and
      no-new-privileges (see docker-compose.yml). edge is the Caddy image,
      which binds privileged ports 80/443 as root and drops privileges to its
      own worker internally. frontend/Dockerfile (nginx) is legacy and not part
      of the deployed path - production serves the SPA via edge/Dockerfile
      (Caddy); it is a candidate for removal. Every application service and the
      offensive tool-runner run as non-root fixed UIDs.
